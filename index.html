<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DREAM HUB - รวมซีรีส์พากย์ไทย</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e50914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DREAM HUB">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- HLS.js for .m3u8 streaming support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <style>
    :root {
      --primary: #e50914;
      --bg: #141414;
      --card-bg: #1f1f1f;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* Header */
    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(20,20,20,0.95) 100%);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .install-btn {
      display: none;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.4);
    }
    .nav-tag {
      background: #262626;
      font-size: 12px;
      color: #e50914;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid #3d3d3d;
    }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Catalog Home */
    .hero-banner {
      padding: 24px 20px 14px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .hero-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hero-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Continue Watching Banner */
    .continue-banner {
      display: none;
      margin-top: 16px;
      background: linear-gradient(90deg, #2d0608 0%, #1f1f1f 100%);
      border: 1px solid #7f1d1d;
      border-radius: 12px;
      padding: 14px 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .continue-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(229, 9, 20, 0.25);
    }
    .continue-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .continue-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .continue-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .continue-sub {
      font-size: 12px;
      color: #fca5a5;
      margin-top: 2px;
    }
    .continue-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .drama-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .drama-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    }
    @media (min-width: 900px) {
      .drama-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
    }
    @media (min-width: 1100px) {
      .drama-grid { grid-template-columns: repeat(5, 1fr); gap: 24px; }
    }

    .drama-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .drama-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(229, 9, 20, 0.35);
      border-color: var(--primary);
    }
    .poster-box {
      width: 100%;
      aspect-ratio: 2/3;
      background: #2a2a2a;
      position: relative;
      overflow: hidden;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .drama-card:hover .poster-box img {
      transform: scale(1.05);
    }
    .badge-ep {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-dub {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-progress {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .card-info {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Player View */
    .player-view {
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    .player-top-bar {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { background: #383838; }
    .now-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .video-container {
      width: 100%;
      background: #000;
      aspect-ratio: 9/16;
      max-height: 65vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .video-container {
        border-radius: 12px;
        margin-top: 14px;
        max-height: 560px;
      }
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    .player-controls {
      background: #1c1c1c;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .nav-btn {
      background: #2d2d2d;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover { background: #3d3d3d; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .current-ep-badge {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
    }

    .auto-next-box {
      padding: 10px 16px;
      background: #171717;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #bbb;
      border-bottom: 1px solid var(--border);
    }
    .auto-next-box input {
      accent-color: var(--primary);
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .ep-selector {
      padding: 16px;
    }
    .ep-selector-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #ddd;
      font-weight: 600;
    }
    .ep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .ep-item {
      background: #242424;
      border: 1px solid #383838;
      color: #aaa;
      padding: 9px 0;
      text-align: center;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ep-item:hover { background: #333; color: #fff; }
    .ep-item.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

  <header>

  <div id="playerView" class="view">

      </div>

      <div class="auto-next-box">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">

          <span>เล่นตอนถัดไปอัตโนมัติ (Auto-Play Next)</span>

        <span id="nextTimer" style="color:var(--primary); font-size:12px; font-weight:600;"></span>
      </div>

      <div class="ep-selector">
        <div class="ep-selector-head">
          <span>เลือกตอน</span>
          <span style="font-size:12px; color:#888;">แตะเพื่อเปลี่ยนตอน</span>
        </div>
        <div class="ep-grid" id="epGrid"></div>
      </div>
    </div>
  </div>

    let currentDrama = null;
    let currentEpIndex = 0;
    let resumeTimePending = 0;
    let hlsInstance = null;

    const catalogView = document.getElementById('catalogView');
    const playerView = document.getElementById('playerView');
    const dramaGrid = document.getElementById('dramaGrid');
    const continueBanner = document.getElementById('continueBanner');
    const continueDramaTitle = document.getElementById('continueDramaTitle');
    const continueEpInfo = document.getElementById('continueEpInfo');

    const video = document.getElementById('videoPlayer');
    const nowTitle = document.getElementById('nowTitle');
    const epIndicator = document.getElementById('epIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const autoNextToggle = document.getElementById('autoNextToggle');
    const nextTimer = document.getElementById('nextTimer');
    const epGrid = document.getElementById('epGrid');
    const toast = document.getElementById('toast');
    const installAppBtn = document.getElementById('installAppBtn');

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installAppBtn) installAppBtn.style.display = 'inline-flex';
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            installAppBtn.style.display = 'none';
            showToast('กำลังติดตั้งแอป DREAM HUB...');
          }
          deferredPrompt = null;
        });
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function renderCatalog() {
      dramaGrid.innerHTML = '';

      // Check last active drama for quick continue banner
      const lastActiveId = safeStorage.getItem('last_active_drama');
      if (lastActiveId) {
        const activeDrama = dramas.find(d => d.id === lastActiveId);
        if (activeDrama) {
          const savedEp = parseInt(safeStorage.getItem('last_ep_' + activeDrama.id) || '0', 10);
          const savedTime = parseFloat(safeStorage.getItem('last_time_' + activeDrama.id + '_' + savedEp) || '0');
          continueDramaTitle.textContent = activeDrama.title;
          continueEpInfo.textContent = 'ดูต่อ ตอนที่ ' + (savedEp + 1) + (savedTime > 5 ? ' (นาทีที่ ' + formatTime(savedTime) + ')' : '');
          continueBanner.style.display = 'flex';
        }
      } else {
        continueBanner.style.display = 'none';
      }

      dramas.forEach(drama => {
        const card = document.createElement('div');
        card.className = 'drama-card';
        card.onclick = () => openDrama(drama.id);

        const savedEp = safeStorage.getItem('last_ep_' + drama.id);
        const progressBadge = savedEp !== null
          ? `<span class="badge-progress">ดูถึงตอน ${parseInt(savedEp, 10) + 1}</span>`
          : '';

        card.innerHTML = `
          <div class="poster-box">
            <img src="${drama.poster}" alt="${drama.title}" loading="lazy">
            <span class="badge-dub">พากย์ไทย</span>
            ${progressBadge}
            <span class="badge-ep">${drama.totalEpisodes} ตอนจบ</span>
          </div>
          <div class="card-info">
            <div class="card-title">${drama.title}</div>
            <div class="card-meta">
              <span>ซีรีส์สั้น • จบในตอน</span>
              ${savedEp !== null ? '<span style="color:#10b981; font-weight:600;">กำลังรับชม</span>' : ''}
            </div>
          </div>
        `;
        dramaGrid.appendChild(card);
      });
    }

    function resumeLastActiveDrama() {
      const lastActiveId = safeStorage.getItem('last_active_drama');
      if (lastActiveId) {
        openDrama(lastActiveId);
      }
    }

    function showCatalog() {
      try {
        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }
        if (video) {
          video.pause();
          video.src = "";
        }
      } catch(e) {}
      playerView.classList.remove('active');
      catalogView.classList.add('active');
      renderCatalog();
      window.scrollTo(0, 0);
    }

    function openDrama(dramaId) {
      currentDrama = dramas.find(d => d.id === dramaId);
      if (!currentDrama) return;

      safeStorage.setItem('last_active_drama', currentDrama.id);
      nowTitle.textContent = currentDrama.title;
      catalogView.classList.remove('active');
      playerView.classList.add('active');
      window.scrollTo(0, 0);

      renderEpGrid();

      // Retrieve saved episode
      const saved = safeStorage.getItem('last_ep_' + currentDrama.id);
      const startIdx = saved ? parseInt(saved, 10) : 0;
      const validIdx = (startIdx >= 0 && startIdx < currentDrama.episodes.length) ? startIdx : 0;

      // Retrieve saved time for this episode
      const savedTime = parseFloat(safeStorage.getItem('last_time_' + currentDrama.id + '_' + validIdx) || '0');
      resumeTimePending = (savedTime > 2) ? savedTime : 0;

      loadEpisode(validIdx, true);
    }

    function renderEpGrid() {
      epGrid.innerHTML = '';
      currentDrama.episodes.forEach((ep, idx) => {
        const btn = document.createElement('button');
        btn.className = 'ep-item' + (idx === currentEpIndex ? ' active' : '');
        btn.id = 'ep-item-' + idx;
        btn.textContent = ep.number;
        btn.onclick = () => {
          resumeTimePending = 0;
          loadEpisode(idx, true);
        };
        epGrid.appendChild(btn);
      });
    }

    function loadEpisode(idx, autoPlay = true) {
      if (!currentDrama || idx < 0 || idx >= currentDrama.episodes.length) return;
      currentEpIndex = idx;
      const ep = currentDrama.episodes[currentEpIndex];

      epIndicator.textContent = 'ตอนที่ ' + ep.number + ' / ' + currentDrama.totalEpisodes;
      prevBtn.disabled = (currentEpIndex === 0);
      nextBtn.disabled = (currentEpIndex === currentDrama.episodes.length - 1);

      document.querySelectorAll('.ep-item').forEach((b, i) => {
        b.classList.toggle('active', i === currentEpIndex);
      });

      const activeBtn = document.getElementById('ep-item-' + currentEpIndex);
      if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Save progress
      safeStorage.setItem('last_ep_' + currentDrama.id, currentEpIndex);
      safeStorage.setItem('last_active_drama', currentDrama.id);

      const applyResumeTime = () => {
        if (resumeTimePending > 0) {
          const seekTarget = resumeTimePending;
          resumeTimePending = 0;
          if (seekTarget < video.duration - 3) {
            video.currentTime = seekTarget;
            showToast('▶️ เล่นต่อจาก ' + formatTime(seekTarget));
          } else {
            showToast('กำลังเล่น ตอนที่ ' + ep.number);
          }
        } else {
          showToast('กำลังเล่น ตอนที่ ' + ep.number);
        }
      };

      if (ep.url.includes('.m3u8')) {
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls();
          hlsInstance.loadSource(ep.url);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            applyResumeTime();
            if (autoPlay) video.play().catch(e => console.log('Autoplay prevented:', e));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
          video.src = ep.url;
          video.addEventListener('loadedmetadata', applyResumeTime, { once: true });
          video.load();
          if (autoPlay) video.play().catch(e => console.log('Autoplay prevented:', e));
        }
      } else {
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        video.src = ep.url;
        video.addEventListener('loadedmetadata', applyResumeTime, { once: true });
        video.load();
        if (autoPlay) video.play().catch(e => console.log('Autoplay prevented:', e));
      }
    }

    function nextEp() {
      if (currentDrama && currentEpIndex < currentDrama.episodes.length - 1) {
        resumeTimePending = 0;
        loadEpisode(currentEpIndex + 1, true);
      }
    }

    function prevEp() {
      if (currentDrama && currentEpIndex > 0) {
        resumeTimePending = 0;
        loadEpisode(currentEpIndex - 1, true);
      }
    }

    video.addEventListener('timeupdate', () => {
      if (currentDrama && video.currentTime > 2 && !video.ended) {
        safeStorage.setItem('last_time_' + currentDrama.id + '_' + currentEpIndex, video.currentTime);
      }
    });

    video.addEventListener('ended', () => {
      if (currentDrama) {
        safeStorage.setItem('last_time_' + currentDrama.id + '_' + currentEpIndex, 0);
      }

      if (autoNextToggle.checked) {
        if (currentDrama && currentEpIndex < currentDrama.episodes.length - 1) {
          nextTimer.textContent = 'กำลังเริ่มตอนที่ ' + (currentEpIndex + 2) + '...';
          setTimeout(() => {
            nextTimer.textContent = '';
            nextEp();
          }, 800);
        } else {
          showToast('จบเรื่องแล้ว!');
        }
      }
    });

    video.addEventListener('error', (e) => {
      console.warn('Video load error');
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('Service Worker registration skipped:', err);
        });
      });
    }

    renderCatalog();
  </script>
